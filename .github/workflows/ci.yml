name: ci

# Three gates, each proving something different:
#
#   test    — the suite passes. It did not before: the benchmark test spawns child processes and
#             timed out against vitest's 5 s default on every run, so "5 tests" was really 4 and
#             a failure nobody was watching.
#   claims  — every number in the README table still exists in docs/FINDINGS.md. A hand-copied
#             table is how a published number drifts from the measurement behind it; the README
#             claimed to beat xz and 7z for as long as nothing checked it.
#   cli     — the shipped CLI round-trips a file byte for byte, refuses to overwrite without
#             --force, and exits non-zero on a command it does not implement.
#   build   — the production build actually builds. It is not runnable in the 2 GiB development
#             sandbox (Vite 8's rolldown is WebAssembly and dies against a 1.5 GB virtual-memory
#             cap), so CI is the only place this claim can be tested.
#
# Nothing here downloads a corpus or measures a ratio: that is scripts/bench.py, run by hand on
# a machine, because 200 MB of compression does not belong in a CI step.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install from the lockfile
        run: bun install --frozen-lockfile
      - name: Run the suite
        run: bun run test

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README numbers must exist in docs/FINDINGS.md
        run: python3 scripts/check-claims.py --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install from the lockfile
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: The build emitted a server bundle
        run: |
          set -euo pipefail
          echo "produced:"; ls -d dist .output 2>/dev/null || true
          # Nitro writes .output/ by default; a config that overrides the output dir writes
          # dist/server. Either is a real build; neither is a build that did nothing.
          test -d .output || test -d dist/server

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Round trip is byte exact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rt"
          head -c 1048576 /dev/urandom > "$RUNNER_TEMP/rt/in.bin"
          # Random bytes do not compress; the property under test is the round trip, not the ratio.
          node public/faztest.mjs compress "$RUNNER_TEMP/rt/in.bin" -q 9
          node public/faztest.mjs decompress "$RUNNER_TEMP/rt/in.bin.br" -o "$RUNNER_TEMP/rt/out.bin"
          cmp "$RUNNER_TEMP/rt/in.bin" "$RUNNER_TEMP/rt/out.bin"
          echo "round trip: byte exact"
      - name: Refuses to overwrite without --force
        run: |
          set -euo pipefail
          if node public/faztest.mjs compress "$RUNNER_TEMP/rt/in.bin" 2>"$RUNNER_TEMP/rt/err.txt"; then
            echo "compress overwrote an existing archive without --force"; exit 1
          fi
          grep -q "already exists" "$RUNNER_TEMP/rt/err.txt"
          echo "overwrite refusal: ok"
      - name: An unimplemented command exits non-zero
        run: |
          set -euo pipefail
          set +e
          node public/faztest.mjs frobnicate "$RUNNER_TEMP/rt/in.bin" >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "an unknown command exited 0 — it must refuse, not no-op"; exit 1
          fi
          echo "unknown command: exit $code"
